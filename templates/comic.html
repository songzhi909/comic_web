<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ comic_title }} - Comic Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #222;
            color: white;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
        }
        .header {
            background-color: #333;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .comic-title {
            margin: 0;
            font-size: 1.2em;
        }
        .back-link {
            color: #4da6ff;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            width: 100%;
        }
        .btn {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn.bookmark {
            background-color: #28a745;
        }
        .btn.bookmark:hover {
            background-color: #1e7e34;
        }
        .btn.bookmark.active {
            background-color: #ffc107;
            color: #212529;
        }
        .metadata-btn {
            background-color: #6c757d;
        }
        .metadata-btn:hover {
            background-color: #5a6268;
        }
        .images-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }
        .comic-image {
            max-width: 95%;
            width: 100%; /* Scale up small images to fit container */
            height: auto; /* Maintain aspect ratio */
            margin-bottom: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            display: block;
        }
        .loading {
            color: #999;
            font-style: italic;
            padding: 20px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #333;
            padding: 20px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            max-height: 90%;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .close {
            font-size: 1.5em;
            cursor: pointer;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #555;
            background-color: #444;
            color: white;
        }
        .form-group textarea {
            height: 80px;
            resize: vertical;
        }
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        .btn.cancel {
            background-color: #6c757d;
        }
        .btn.cancel:hover {
            background-color: #5a6268;
        }
        .btn.save {
            background-color: #28a745;
        }
        .btn.save:hover {
            background-color: #1e7e34;
        }
        
        /* Cartoon-style image counter */
        .image-counter {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #ff6b6b;
            color: white;
            padding: 10px 15px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 99;
            border: 3px solid white;
            text-align: center;
            min-width: 80px;
        }
        
        .image-counter::before {
            content: "📄";
            margin-right: 5px;
        }
        
        .image-counter:hover {
            transform: scale(1.1);
            transition: transform 0.2s ease;
        }
        
        /* Animation for the counter */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }
        
        .image-counter.updated {
            animation: bounce 0.5s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="comic-title">{{ comic_title }}</h1>
            <a href="/" class="back-link">← Back to Comics</a>
            
            <div class="controls">
                <button id="toggle-header-btn" class="btn toggle-header">Hide Header</button>
                <button id="bookmark-btn" class="btn bookmark">Bookmark</button>
                <button id="metadata-btn" class="btn metadata-btn">Edit Metadata</button>
            </div>
        </div>
        
        <div class="images-container" id="images-container">
            <!-- Images will be loaded here dynamically -->
        </div>
    </div>
    
    <!-- Image counter (cartoon style) -->
    <div class="image-counter" id="image-counter">
        <span id="current-image">0</span> / <span id="total-images">{{ total_images | default(0) }}</span>
    </div>
    
    <!-- Metadata Modal -->
    <div id="metadata-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Metadata</h2>
                <span class="close">&times;</span>
            </div>
            <form id="metadata-form">
                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" value="{{ request.args.get('title', '') }}">
                </div>
                <div class="form-group">
                    <label for="author">Author:</label>
                    <input type="text" id="author" name="author" value="{{ request.args.get('author', '') }}">
                </div>
                <div class="form-group">
                    <label for="tags">Tags (comma separated):</label>
                    <input type="text" id="tags" name="tags" value="{{ request.args.get('tags', '') }}">
                </div>
                <div class="form-group">
                    <label for="description">Description:</label>
                    <textarea id="description" name="description">{{ request.args.get('description', '') }}</textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn cancel">Cancel</button>
                    <button type="submit" class="btn save">Save</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        // Global variables
        let currentPage = 1;
        let isLoading = false;
        let hasMore = true;
        let totalImages = {{ total_images | default(0) }};
        let bookmarks = {};
        let comicMetadata = {};
        let currentImageCount = 0; // Track currently loaded images
        let currentViewedImage = 0; // Track currently viewed image
        
        // DOM elements
        let imagesContainer;
        let bookmarkBtn;
        let metadataBtn;
        let metadataModal;
        let closeModal;
        let cancelModal;
        let metadataForm;
        let imageCounter; // Image counter element
        let currentImageElement; // Current image count element
        let totalImagesElement; // Total images count element
        
        // Function to update image counter
        function updateImageCounter() {
            if (currentImageElement) {
                currentImageElement.textContent = currentViewedImage;
                // Add animation class and remove it after animation completes
                if (imageCounter) {
                    imageCounter.classList.add('updated');
                    setTimeout(() => {
                        imageCounter.classList.remove('updated');
                    }, 500);
                }
            }
        }
        
        // Function to update bookmark button state
        function updateBookmarkButton() {
            if (!bookmarkBtn) return;
            
            if (bookmarks && bookmarks['{{ comic_name }}']) {
                bookmarkBtn.textContent = 'Bookmarked';
                bookmarkBtn.classList.add('active');
            } else {
                bookmarkBtn.textContent = 'Bookmark';
                bookmarkBtn.classList.remove('active');
            }
        }
        
        // Function to open metadata modal
        function openMetadataModal() {
            if (!metadataModal) return;
            metadataModal.style.display = 'flex';
        }
        
        // Function to close metadata modal
        function closeMetadataModal() {
            if (!metadataModal) return;
            metadataModal.style.display = 'none';
        }
        
        // Function to toggle header visibility
        function toggleHeader() {
            const header = document.querySelector('.header');
            const toggleBtn = document.getElementById('toggle-header-btn');
            
            if (!header || !toggleBtn) return;
            
            if (header.style.display === 'none') {
                // Show header
                header.style.display = '';
                toggleBtn.textContent = 'Hide Header';
                toggleBtn.classList.remove('header-hidden');
            } else {
                // Hide header
                header.style.display = 'none';
                toggleBtn.textContent = 'Show Header';
                toggleBtn.classList.add('header-hidden');
            }
        }
        
        // Load bookmarks from server
        function loadBookmarks() {
            fetch('/api/bookmarks')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    bookmarks = data;
                    updateBookmarkButton();
                })
                .catch(error => {
                    console.error('Error loading bookmarks:', error);
                });
        }
        
        // Load comic metadata from server
        function loadComicMetadata() {
            fetch(`/api/comic/{{ comic_name | urlencode }}/metadata`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    comicMetadata = data;
                    // Populate form fields
                    const titleEl = document.getElementById('title');
                    const authorEl = document.getElementById('author');
                    const tagsEl = document.getElementById('tags');
                    const descriptionEl = document.getElementById('description');
                    
                    if (titleEl) titleEl.value = data.title || '';
                    if (authorEl) authorEl.value = data.author || '';
                    if (tagsEl) tagsEl.value = Array.isArray(data.tags) ? data.tags.join(', ') : data.tags || '';
                    if (descriptionEl) descriptionEl.value = data.description || '';
                })
                .catch(error => {
                    console.error('Error loading metadata:', error);
                });
        }
        
        // Toggle bookmark for current comic
        function toggleBookmark() {
            if (!bookmarks) return;
            
            const isBookmarked = bookmarks && bookmarks['{{ comic_name | urlencode }}'];
            
            const action = isBookmarked ? 'remove' : 'add';
            const comicTitle = (comicMetadata && comicMetadata.title) || '{{ comic_title | tojson }}';
            
            // Save bookmark to server
            fetch('/api/bookmarks', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    comic_name: '{{ comic_name | urlencode }}',
                    comic_title: comicTitle,
                    action: action
                })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    // Update local bookmarks state
                    if (isBookmarked) {
                        delete bookmarks['{{ comic_name | urlencode }}'];
                    } else {
                        bookmarks['{{ comic_name | urlencode }}'] = {
                            title: comicTitle,
                            timestamp: new Date().toISOString()
                        };
                    }
                    updateBookmarkButton();
                } else {
                    console.error('Failed to update bookmark');
                }
            })
            .catch(error => {
                console.error('Error updating bookmark:', error);
            });
        }
        
        // Save metadata
        function saveMetadata(event) {
            event.preventDefault();
            
            const titleEl = document.getElementById('title');
            const authorEl = document.getElementById('author');
            const tagsEl = document.getElementById('tags');
            const descriptionEl = document.getElementById('description');
            
            const metadata = {
                title: titleEl ? titleEl.value : '',
                author: authorEl ? authorEl.value : '',
                tags: tagsEl ? tagsEl.value : '',
                description: descriptionEl ? descriptionEl.value : ''
            };
            
            fetch(`/api/comic/{{ comic_name | urlencode }}/metadata`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(metadata)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    // Update local metadata
                    comicMetadata = metadata;
                    if (metadataModal) {
                        metadataModal.style.display = 'none';
                    }
                    // Reload page to show updated metadata
                    location.reload();
                } else {
                    console.error('Failed to save metadata:', data.error);
                }
            })
            .catch(error => {
                console.error('Error saving metadata:', error);
            });
        }
        
        // Handle scroll for infinite loading
        function handleScroll() {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 1000) {
                loadMoreImages();
            }
            
            // Update current viewed image based on scroll position
            updateCurrentViewedImage();
        }
        
        // Update which image is currently viewed based on scroll position
        function updateCurrentViewedImage() {
            if (!imagesContainer) return;
            
            const images = imagesContainer.querySelectorAll('.comic-image');
            if (images.length === 0) return;
            
            // Find the image that is currently in view
            for (let i = 0; i < images.length; i++) {
                const rect = images[i].getBoundingClientRect();
                // If image is in viewport (top is above bottom of screen and bottom is below top of screen)
                if (rect.top <= window.innerHeight && rect.bottom >= 0) {
                    // Update current viewed image (1-indexed)
                    currentViewedImage = i + 1;
                    updateImageCounter();
                    break;
                }
            }
        }
        
        // Load more images
        function loadMoreImages() {
            if (isLoading || !hasMore) return;
            
            isLoading = true;
            currentPage++;
            
            // Show loading indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading';
            loadingDiv.textContent = 'Loading more images...';
            if (imagesContainer) imagesContainer.appendChild(loadingDiv);
            
            fetch(`/api/comic/{{ comic_name | urlencode }}/images?page=${currentPage}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    // Remove loading indicator
                    if (imagesContainer && loadingDiv.parentNode) {
                        imagesContainer.removeChild(loadingDiv);
                    }
                    
                    // Add new images
                    data.images.forEach(imageInfo => {
                        const img = document.createElement('img');
                        img.src = `/comics/{{ comic_name | urlencode }}/${imageInfo.filename}`;
                        img.alt = imageInfo.filename;
                        img.className = 'comic-image';
                        img.loading = 'lazy';
                        
                        // Set image dimensions if available for better rendering performance
                        if (imageInfo.width && imageInfo.height) {
                            img.width = imageInfo.width;
                            img.height = imageInfo.height;
                        }
                        
                        if (imagesContainer) imagesContainer.appendChild(img);
                    });
                    
                    // Update current image count
                    currentImageCount += data.images.length;
                    
                    hasMore = data.has_more;
                    isLoading = false;
                })
                .catch(error => {
                    // Remove loading indicator
                    if (imagesContainer && loadingDiv.parentNode) {
                        imagesContainer.removeChild(loadingDiv);
                    }
                    console.error('Error loading more images:', error);
                    isLoading = false;
                });
        }
        
        // Load initial images
        function loadInitialImages() {
            if (isLoading || !hasMore) return;
            
            isLoading = true;
            
            fetch(`/api/comic/{{ comic_name | urlencode }}/images?page=1`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    // Add initial images
                    data.images.forEach(imageInfo => {
                        const img = document.createElement('img');
                        img.src = `/comics/{{ comic_name | urlencode }}/${imageInfo.filename}`;
                        img.alt = imageInfo.filename;
                        img.className = 'comic-image';
                        img.loading = 'lazy';
                        
                        // Set image dimensions if available for better rendering performance
                        if (imageInfo.width && imageInfo.height) {
                            img.width = imageInfo.width;
                            img.height = imageInfo.height;
                        }
                        
                        if (imagesContainer) imagesContainer.appendChild(img);
                    });
                    
                    // Update current image count
                    currentImageCount = data.images.length;
                    
                    hasMore = data.has_more;
                    isLoading = false;
                    
                    // Add scroll listener to update current viewed image
                    window.addEventListener('scroll', updateCurrentViewedImage);
                })
                .catch(error => {
                    console.error('Error loading initial images:', error);
                    isLoading = false;
                });
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Get DOM elements
            imagesContainer = document.getElementById('images-container');
            bookmarkBtn = document.getElementById('bookmark-btn');
            metadataBtn = document.getElementById('metadata-btn');
            metadataModal = document.getElementById('metadata-modal');
            closeModal = document.querySelector('.close');
            cancelModal = document.querySelector('.btn.cancel');
            metadataForm = document.getElementById('metadata-form');
            imageCounter = document.getElementById('image-counter');
            currentImageElement = document.getElementById('current-image');
            totalImagesElement = document.getElementById('total-images');
            
            // Load initial images
            loadInitialImages();
            
            // Load bookmarks
            loadBookmarks();
            
            // Load metadata
            loadComicMetadata();
            
            // Set up event listeners
            window.addEventListener('scroll', handleScroll);
            
            if (bookmarkBtn) {
                bookmarkBtn.addEventListener('click', toggleBookmark);
            }
            
            if (metadataBtn) {
                metadataBtn.addEventListener('click', openMetadataModal);
            }
            
            if (closeModal) {
                closeModal.addEventListener('click', closeMetadataModal);
            }
            
            if (cancelModal) {
                cancelModal.addEventListener('click', closeMetadataModal);
            }
            
            if (metadataForm) {
                metadataForm.addEventListener('submit', saveMetadata);
            }
            
            // Add event listener for toggle header button
            const toggleHeaderBtn = document.getElementById('toggle-header-btn');
            if (toggleHeaderBtn) {
                toggleHeaderBtn.addEventListener('click', toggleHeader);
            }
            
            // Close modal when clicking outside
            window.addEventListener('click', function(event) {
                if (metadataModal && event.target === metadataModal) {
                    closeMetadataModal();
                }
            });
        });
    </script>
</body>
</html>
