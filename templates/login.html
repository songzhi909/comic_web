<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Web - 登录</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #34495e;
            --accent-color: #e74c3c;
            --light-bg: #f8f9fa;
            --dark-bg: #2c3e50;
            --card-bg: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-radius: 10px;
            --box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--text-primary);
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(10px);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-header h1 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            font-size: 2rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        .login-header p {
            color: var(--secondary-color);
            font-size: 1.1rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--secondary-color);
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 30px;
            box-sizing: border-box;
            font-size: 16px;
            transition: var(--transition);
            outline: none;
        }
        
        .form-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(74, 144, 226, 0.5);
        }
        
        .btn {
            width: 100%;
            padding: 12px 25px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            transition: var(--transition);
            font-weight: 500;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            margin-top: 1rem;
        }
        
        .btn:hover {
            background-color: #3a7bc8;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        .btn-secondary {
            background-color: var(--secondary-color);
        }
        
        .btn-secondary:hover {
            background-color: #2c3e50;
        }
        
        .error-message {
            color: var(--accent-color);
            background-color: #ffebee;
            padding: 12px 20px;
            border-radius: 30px;
            margin-bottom: 1rem;
            display: {% if error %}block{% else %}none{% endif %};
            text-align: center;
            font-weight: 500;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }
        
        .switch-form {
            text-align: center;
            margin-top: 1.5rem;
        }
        
        .switch-form a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }
        
        .switch-form a:hover {
            text-decoration: underline;
            color: #3a7bc8;
        }
        
        #register-btn {
            margin-top: 1rem;
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Comic Web</h1>
            <p>登录您的账户</p>
        </div>
        
        <div class="error-message" id="errorMessage">
            {{ error if error else '' }}
        </div>
        
        <form id="loginForm" method="POST" action="/login">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn">登录</button>
        </form>
        
        {% if enable_registration %}
        <button id="register-btn" type="button" class="btn btn-secondary" onclick="showRegisterForm()">注册新账户</button>
        
        <form id="registerForm" method="POST" action="/register" style="display: none;">
            <div class="form-group">
                <label for="reg_username">用户名</label>
                <input type="text" id="reg_username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="reg_password">密码</label>
                <input type="password" id="reg_password" name="password" required>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">确认密码</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            
            <button type="submit" class="btn btn-secondary">注册</button>
        </form>
        {% endif %}
    </div>
    
    <script>
        function showRegisterForm() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('register-btn').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        }
        
        function showLoginForm() {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('register-btn').style.display = 'block';
        }
        
        // Form validation for registration
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            const password = document.getElementById('reg_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            
            if (password !== confirmPassword) {
                e.preventDefault();
                document.getElementById('errorMessage').textContent = '密码不匹配';
                document.getElementById('errorMessage').style.display = 'block';
            }
        });
    </script>
</body>
</html>
